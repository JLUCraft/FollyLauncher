name: Security audit

on:
  schedule:
    # Mondays 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - src-tauri/Cargo.lock
          - cli/Cargo.lock

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Run from the repository root so the single .cargo/audit.toml applies to
      # both lock files; cargo-audit only reads the config from the working directory.
      - name: Audit ${{ matrix.lockfile }}
        run: cargo audit --file ${{ matrix.lockfile }}
