name: Test

on:
  # Manual runs check macOS; other successful jobs can be reused.
  workflow_dispatch:
  push:
    branches:
      - folly
      - main
    paths:
      - src/**
      - src-tauri/**
      - scripts/game/check_minecraft_boundary.py
      - .github/workflows/**
  pull_request:
    branches:
      - folly
      - main
    paths:
      - src/**
      - src-tauri/**
      - scripts/game/check_minecraft_boundary.py
      - .github/workflows/**

# Cancel prev CI if new commit come (learned from ant-design repo)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_run_lint: ${{ steps.compute.outputs.should_run_lint }}
      should_run_build: ${{ steps.compute.outputs.should_run_build }}
      should_run_check: ${{ steps.compute.outputs.should_run_check }}
    steps:
      - uses: actions/checkout@v7

      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            src:
              - 'src/**'
              - '.github/workflows/**'
            src-non-locales:
              - 'src/**'
              - '!src/locales/**'
            tauri:
              - 'src-tauri/**'
              - 'scripts/game/check_minecraft_boundary.py'

      - id: compute
        shell: bash
        run: |
          should_run_lint=false
          should_run_build=false

          if [ "${{ steps.filter.outputs.src }}" = "true" ] || [ "${{ steps.filter.outputs.tauri }}" = "true" ]; then
            should_run_lint=true
          fi

          if [ "${{ steps.filter.outputs.src-non-locales }}" = "true" ] || [ "${{ steps.filter.outputs.tauri }}" = "true" ]; then
            should_run_build=true
          fi

          should_run_check=$should_run_lint
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            should_run_check=true
          fi

          echo "should_run_check=$should_run_check" >> "$GITHUB_OUTPUT"
          echo "should_run_lint=$should_run_lint" >> "$GITHUB_OUTPUT"
          echo "should_run_build=$should_run_build" >> "$GITHUB_OUTPUT"

  Lint:
    needs: changes
    if: needs.changes.outputs.should_run_lint == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/FollyLauncher

    steps:
      # The launcher links the shared library crates, the game daemon and the
      # server through sibling paths, so CI reproduces the local workspace layout.
      - uses: actions/checkout@v7
        with:
          path: workspace/FollyLauncher

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/union-core
          path: workspace/union-core

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/minecraftd
          path: workspace/minecraftd

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/federated-server
          path: workspace/federated-server

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Lint JavaScript/TypeScript Frontend
        run: bunx eslint src --no-fix --max-warnings=0

      - name: Type-check Frontend
        run: bunx tsc --noEmit

      - name: Check Locale Keys
        run: node scripts/locale/index.js diff en

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Minecraft library boundary
        run: python3 scripts/game/check_minecraft_boundary.py

      - name: Lint Rust Backend
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  Check:
    name: Check (macOS)
    needs: changes
    if: needs.changes.outputs.should_run_check == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: workspace/FollyLauncher

    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/FollyLauncher

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/union-core
          path: workspace/union-core

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/minecraftd
          path: workspace/minecraftd

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/federated-server
          path: workspace/federated-server

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "workspace/FollyLauncher/src-tauri -> target"
          key: macos-check

      # macOS-only branches (menus, updater bundles) never compile on the
      # linux lint job, so check them on a macos runner without packaging.
      - name: Check Rust Backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --all-targets

  Build:
    needs: changes
    if: needs.changes.outputs.should_run_build == 'true'
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: workspace/FollyLauncher
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: macos-latest
          #   args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-latest'
          - platform: 'windows-latest'

    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/FollyLauncher

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/union-core
          path: workspace/union-core

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/minecraftd
          path: workspace/minecraftd

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/federated-server
          path: workspace/federated-server

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "workspace/FollyLauncher/src-tauri -> target"
          key: ${{ matrix.platform }}

      # Warnings depend on which cfg branches the host compiles, so the Rust
      # lint gate runs on the platform job instead of the ubuntu-only Lint job.
      - name: Clippy Rust Backend
        if: matrix.platform == 'ubuntu-latest'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Bump version for test build
        run: bun run version bump 0.0.1

      - name: Test Build
        run: bun run tauri build --features devtools --no-bundle -- --profile test-build
        env:
          SJMCL_CURSEFORGE_API_KEY: ${{ secrets.SJMCL_CURSEFORGE_API_KEY }}
          # Exposed to Rust as compile-time constants by build.rs (all SJMCL_* env vars).
          SJMCL_BUILD_TYPE: test-build
          SJMCL_COMMIT_SHA: ${{ github.sha }}

      - name: Build portable artifact
        id: portable
        if: matrix.platform == 'windows-latest' || matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p artifacts
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            OUTPUT_NAME="SJMCL_${SHORT_SHA}_windows_x86_64_portable.exe"
            python scripts/release/bundle_portable_assets.py -p "src-tauri/target/test-build/" -o "$OUTPUT_NAME" "SJMCL.exe"
          else
            OUTPUT_NAME="SJMCL_${SHORT_SHA}_linux_x86_64_portable"
            python scripts/release/bundle_portable_assets.py -p "src-tauri/target/test-build/" -o "$OUTPUT_NAME" "SJMCL"
          fi
          cp "src-tauri/target/test-build/$OUTPUT_NAME" artifacts/
          echo "output_name=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload portable artifact
        if: matrix.platform == 'windows-latest' || matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          path: workspace/FollyLauncher/artifacts/${{ steps.portable.outputs.output_name }}
          archive: false
          if-no-files-found: error
