name: Build Artifacts
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
      upload_artifacts:
        description: 'Whether to upload artifacts'
        required: false
        type: boolean
        default: true
      branch:
        description: 'Git branch to checkout'
        required: false
        type: string
        default: '' # leave empty to use the triggering ref
      build_type:
        description: 'Build type exposed to the app at compile time'
        required: false
        type: string
        default: 'release'
    secrets:
      SJMCL_CURSEFORGE_API_KEY:
        required: true

jobs:
  Build-and-Release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
          - os: windows-latest
            target: i686-pc-windows-msvc
            platform: windows
            arch: i686
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: aarch64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workspace/FollyLauncher

    steps:
      # The launcher links the shared library crates, the game daemon and the
      # server through sibling paths, so CI reproduces the local workspace layout.
      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/FollyLauncher
          ref: ${{ inputs.branch || github.ref || 'folly' }}
          path: workspace/FollyLauncher

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/union-core
          path: workspace/union-core

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/minecraftd
          path: workspace/minecraftd

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/game-server
          path: workspace/federated-server

      # federated-server embeds its founder manifest at compile time; the file
      # stays untracked until the federation settles its founder list (docs/TODO.md),
      # and an empty manifest is a supported build state.
      - name: Scaffold the founder manifest
        shell: bash
        working-directory: workspace/federated-server
        run: |
          if [ ! -f src/founders.json ]; then
            printf '{"federation":"unconfigured","quorum":1,"founders":[]}\n' > src/founders.json
          fi

      - name: Resolve build metadata
        id: build_metadata
        shell: bash
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # See https://github.com/tauri-apps/tauri-action
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # Additional dependencies for ARM64 building
          sudo apt-get install -y xdg-utils
          # Additional dependencies for RPM building
          sudo apt-get install -y rpm

      - name: Install frontend dependencies
        run: |
          bun install --frozen-lockfile

      - name: Remove Font files (MacOS)
        if: matrix.platform == 'macos'
        run: |
          rm -r public/fonts/Sinter/
          rm src/styles/fonts.css
          touch src/styles/fonts.css
      
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "workspace/FollyLauncher/src-tauri -> target"
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Build the app
        run: bun run tauri build --target ${{ matrix.target }}
        env:
          SJMCL_CURSEFORGE_API_KEY: ${{ secrets.SJMCL_CURSEFORGE_API_KEY }}
          SJMCL_BUILD_TYPE: ${{ inputs.build_type }}
          SJMCL_COMMIT_SHA: ${{ steps.build_metadata.outputs.commit_sha }}

      - name: Patch portable executable
        if: matrix.platform == 'windows' || matrix.platform == 'linux'
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            python scripts/release/bundle_portable_assets.py -p "src-tauri/target/${{ matrix.target }}/release/" -o "SJMCL-patched.exe" "SJMCL.exe"
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            python scripts/release/bundle_portable_assets.py -p "src-tauri/target/${{ matrix.target }}/release/" -o "SJMCL-patched" "SJMCL"
          fi

      - name: Setup artifact name
        shell: bash
        run: |
          echo "ARTIFACT_NAME=SJMCL_${{ inputs.version }}_${{ matrix.platform }}_${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Calculate SHA256 checksums
        shell: bash
        run: |
          ARTIFACT_NAME="${{ env.ARTIFACT_NAME }}"
          touch "${ARTIFACT_NAME}.sha256"

          if [ "${{ matrix.platform }}" = "windows" ]; then
            echo "$(sha256sum src-tauri/target/${{ matrix.target }}/release/SJMCL.exe | awk '{print $1}') ${ARTIFACT_NAME}" >> "${ARTIFACT_NAME}.sha256"
            echo "$(sha256sum "src-tauri/target/${{ matrix.target }}/release/SJMCL-patched.exe" | awk '{print $1}') ${ARTIFACT_NAME}_portable" >> "${ARTIFACT_NAME}.sha256"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            echo "$(sha256sum src-tauri/target/${{ matrix.target }}/release/SJMCL | awk '{print $1}') ${ARTIFACT_NAME}_unsigned" >> "${ARTIFACT_NAME}.sha256"
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            echo "$(sha256sum src-tauri/target/${{ matrix.target }}/release/SJMCL | awk '{print $1}') ${ARTIFACT_NAME}" >> "${ARTIFACT_NAME}.sha256"
            echo "$(sha256sum "src-tauri/target/${{ matrix.target }}/release/SJMCL-patched" | awk '{print $1}') ${ARTIFACT_NAME}_portable" >> "${ARTIFACT_NAME}.sha256"
          fi

          cat "${ARTIFACT_NAME}.sha256"

      - name: Prepare release artifact
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ARTIFACT_NAME="${{ env.ARTIFACT_NAME }}"
          echo "Artifact Name: $ARTIFACT_NAME"
          mkdir artifacts

          cp "${ARTIFACT_NAME}.sha256" artifacts/

          if [ "${{ matrix.platform }}" = "windows" ]; then
            mv "src-tauri/target/${{ matrix.target }}/release/SJMCL-patched.exe" artifacts/"$ARTIFACT_NAME"_portable.exe
            mv "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/"*.exe artifacts/"$ARTIFACT_NAME"_setup.exe
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            ls src-tauri/target/${{ matrix.target }}/release/bundle/macos
            # For MacOS, compress the .app folder
            tar -cvzf artifacts/"$ARTIFACT_NAME".app.tar.gz -C "src-tauri/target/${{ matrix.target }}/release/bundle/macos" "SJMCL.app"
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            mv "src-tauri/target/${{ matrix.target }}/release/bundle/deb/"*.deb artifacts/"$ARTIFACT_NAME".deb
            mv "src-tauri/target/${{ matrix.target }}/release/bundle/rpm/"*.rpm artifacts/"$ARTIFACT_NAME".rpm
            mv "src-tauri/target/${{ matrix.target }}/release/SJMCL-patched" artifacts/"$ARTIFACT_NAME"_portable
          fi

          ls -la artifacts

      - name: Upload artifact
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: "workspace/FollyLauncher/artifacts/*"
          if-no-files-found: error 
