[launcher]
name = "JLUCraft FollyLauncher"

[[federated_servers]]
name = "JLU Main"
url = "https://host1.jlucraft.com"
default = true

[[yggdrasil_servers]]
name = "JLUCraft Skin Station"
url = "https://skin.jlucraft.com"
auth_server_url = "https://skin.jlucraft.com/api/yggdrasil"
client_id = "jlucraft-launcher"
scope = "Yggdrasil.PlayerProfiles"
default = true

# Bootstrap peers for DHT discovery.
# Empty list means rely on local cache and direct connections; still usable for local dev.
# Add multiaddr entries (e.g. "/dns4/bootstrap.jlucraft.com/tcp/443/quic-v1/p2p/<peerid>") in production.
bootstrap_peers = []
